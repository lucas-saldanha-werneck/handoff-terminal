name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tests/test_handoff.py -v
  macos-system-python:
    # The python3 that ships with macOS (Command Line Tools) is the one most users have.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: /usr/bin/python3 --version && /usr/bin/python3 tests/test_handoff.py -v
