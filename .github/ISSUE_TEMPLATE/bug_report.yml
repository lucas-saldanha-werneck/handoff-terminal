name: Bug report
description: Something in handoff-terminal did not work. Tip — in Claude Code, /handoff-terminal:bug fills this in for you.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not paste passwords, codes, card numbers, emails or site names.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: handoff-terminal version
      placeholder: "0.5.0 (see claude plugin list)"
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      placeholder: "claude --version"
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 27.2"
  - type: textarea
    id: log
    attributes:
      label: Last lines of the log (optional)
      description: "~/.claude/state/handoff-terminal/handoff.log — remove site names and paths first."
      render: text
